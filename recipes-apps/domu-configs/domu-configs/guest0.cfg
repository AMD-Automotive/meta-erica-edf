# Launch with  xl create -c /etc/xen/guest0.cfg
name = "guest0"
kernel = "/root/Image"
disk = [ 'phy:/dev/sda3,sda1,w', 'phy:/dev/sda4,sda2,w']
extra = "console=hvc0 "
root = "/dev/xvda2 ro"
memory = 1024
vcpus = 2
