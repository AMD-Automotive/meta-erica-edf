# RAVE2 Digital Cockpit autostart configuration
#
# Set CAMERA_TYPE to match the cameras physically attached to this device.
# autostart-dc.sh reads this value and runs the matching camera setup
# script: /usr/bin/config-camera-${CAMERA_TYPE}.sh
#
# Supported values:
#   quanta_imx623   - Quanta Sony IMX623 cameras
#   leopard_imx623  - Leopard Imaging Sony IMX623 cameras
#   tpg             - Test Pattern Generator (no physical cameras)

CAMERA_TYPE="tpg"
