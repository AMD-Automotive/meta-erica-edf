# 2026.1 (kernel 6.18) only — enable the Xilinx AVPG display driver, which
# selects DRM_GEM_SHMEM_HELPER. That prompt-less tristate helper cannot be set
# directly from a fragment; it is only enabled when a driver selects it.
# 2025.2's kernel config pulled it in the same way. Required so the out-of-tree
# vitis-ai amdxdna.ko can resolve drm_gem_shmem_* symbols at modpost.
CONFIG_DRM_XLNX_AVPG=y

# Lets CMA be used above 4G
CONFIG_ZONE_DMA32=n
