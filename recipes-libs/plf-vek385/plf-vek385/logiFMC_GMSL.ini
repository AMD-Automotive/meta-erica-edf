// Video card:      GMSL2 - init
slave-id 0x5E    // 0x2f<<1 Voltage adjustment for Camera
    0x00, 0x04   // writes to 7-bit i2c address 0x2f (0x5e) value for 9 V
delay 100ms

slave-id 0x98    // 0x4c<<1 Set DAC to ignore LDAC pin
    { 0x60, 0xff, 0xff }  
    { 0x3f, 0x00, 0x00 }   // DAC mode 6Gbps

slave-id 0x40    // 0x20<<1 Set expander pins as output
    { 0x01, 0x00 }  
    { 0x15, 0x80 }   // disable all dererializators and camera power
delay 200ms
    { 0x15, 0x00 }   // disable all dererializators and power up cameras

delay 200ms


