//variable DESERIALIZER 0xd0

variable SER_Y_PIPE 0x12
variable SER_U_PIPE 0x11



slave-id DESERIALIZER    // Serializer i2c address on Xylon GMSL2 camera
    0x0010, 0x40    // Reset LINK A datapath
    delay 50ms
    0x0010, 0x2    //  Select LINK B datapath
    delay 200ms

    file Xylon_9295A_ar0231_new.ini

// Reset LINK B datapath
slave-id DESERIALIZER  
    0x0010, 0x40     // Reset LINK B datapath
    
    delay 50ms

//  enable LINK
//0x0010, 0x02    // 1 only  single link
//slave-id DESERIALIZER  
//    0x0010, 0x03     // Select SPLITTER MODE
//    delay 50ms

