//variable DESERIALIZER 0xd0

slave-id 0x40    // 0x20<<1 Set expander pins as output
    { 0x15, EXP_SEL_DESER }   // enable only selected deser
delay 200ms


/// DESERIALIZER
slave-id DESERIALIZER
//  {0x0010, 0x80},  	//0x21 for Link A 0x22 for Link B
//	    delay 200ms
  //{0x0010, 0x21},  	//0x21 for Link A 0x22 for Link B
  //   delay 50ms
    // Packet stream configuration (RX0)
    {0x0050, 0x00},
    {0x0051, 0x01},
    {0x0052, 0x02},
    {0x0053, 0x03},
    // PHY frequency settings (800 MHz) (BACKTOP_22 ..)
//    {0x031D, 0x20},
    {0x0320, 0x2F},   // For Port A
    {0x0323, 0x20},   // For Port B
    // Pipeline settings (BACKTOP15 ..
    {0x0316, 0x64},                   // Software defined data type for pipeline X and high bits of pipeline Y
    {0x0317, 0x7E},                   // Rest of bits for Z and Y
    {0x0318, 0x8A},                   // Software defined data type for pipeline U and low bits of pipeline Z
    {0x0319, 0x90},                   // BPP for pipeline Y and high bits for pipeline Z
    {0x0313, 0x82},                   // BPP for pipeline X
    {0x031A, 0x40},                   // BPP for pipeline U and low bits for pipeline Z
	// Lane Control
    {0x040A, 0x10},     //  Lane Control 0
    {0x044A, 0xD0},     //  Lane Control 1 - Port A
    {0x048A, 0x10},     //  Lane Control 2 - Port B
    {0x04CA, 0x10},      //  Lane Control 3
	// Pipe Y Mappings
	{0x044B, 0x07},		//	Map_SRC_0 and Map_DST_0 enable
	{0x046D, 0x15},		// 	MAP_SRC_0 and MAP_DST_0 to DPHY1
	{0x044D, 0x1E},		//	VC and DT source map 0
	{0x044E, 0x1E},		//	VC and DT destination map 0
	{0x044F, 0x00},		//	VC and DT source map 1
	{0x0450, 0x00},		//	VC and DT destination map 1
	{0x0451, 0x01},		//	VC and DT source map 1
	{0x0452, 0x01},		//	VC and DT destination map 1  */
	// Pipe Z Mappings
	{0x048B, 0x07},		//	Map_SRC_0 and Map_DST_0 enable
	{0x04AD, 0x15},		// 	MAP_SRC_0 and MAP_DST_0 to DPHY1
	{0x048D, 0x1E},		//	VC and DT source map 0
	{0x048E, 0x5E},		//	VC and DT destination map 0
	{0x048F, 0x00},		//	VC and DT source map 1
	{0x0490, 0x40},		//	VC and DT destination map 1
	{0x0491, 0x01},		//	VC and DT source map 1
	{0x0492, 0x41},		//	VC and DT destination map 1  */
  {0x0040, 0x21}    // change i2c timeout
    delay 200ms
    {0x0010, 0x23},  	//0x21 for Link A 0x22 for Link B
    delay 50ms
    0x0010, 0x03
    delay 200ms
