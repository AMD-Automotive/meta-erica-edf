// Video card:      GMSL2
// Resolution:      
// Data type:       YUV422 8-bit (input and output)
// Virtual channel: 0
// FPGA I2C:                 (slave-id 0x88)
// Deserializer:    MAX9296A (slave-id deser)
// Serializer:      MAX9295A (slave-id 0x80)
// Imager:          AR0231   (slave-id 0x20)
// Note: colors are inverted, override in preview

default delay 1ms      // Add delay after each I2C command when accessing remote sensor and serializer

variable SER_PHY 0x80
variable SER_SENS_PHY 0x20
variable SER_FPGA_PHY 0x88        


// SET SERIALIZER ADDR
slave-id SER_PHY    // Serializer i2c address on Xylon GMSL2 camera
    0x0000, SER_LOG    //  For LINK A set addr 0x34<<1
    delay 5ms
    
// Serializer LINk A init
slave-id SER_LOG   
	{0x0042,  SER_SENS_LOG},  // SENSOR alias
	{0x0043,  SER_SENS_PHY},  // SENSOR
	{0x0044,  SER_FPGA_LOG},  // FPGA alias
	{0x0045,  SER_FPGA_PHY},  // FPGA
	// Packet settings (TX3)
    {0x0053, 0x10},
    {0x0057, SER_Y_PIPE},
    {0x005B, SER_U_PIPE},
    {0x005F, 0x13},
    // Color BPP (VIDEO_TX1)
    {0x0101, 0x50},
    {0x0109, 0x10},
    {0x0111, 0x50},
    {0x0119, 0x50},
    // Designated datatype to route to video pipeline (FRONTTOP_12 ...)
    {0x0314, 0x00},
    {0x0316, 0x5E},
    {0x0318, 0x00},
    {0x031A, 0x00},
    // Enable CSI port B, CSI port B selection for video pipeline Y (FRONTTOP_0)
    {0x0308, 0x7F},
    // Start video pipe Y from CSI port B (FRONTTOP_9)
    {0x0311, 0x25},
    // Video transmit enable for pipeline Y
    {0x0002, 0xF3}
 
    delay 20ms
slave-id SER_FPGA_LOG    // FPGA_IIC_ADDR
    {0x40, 0x00, 0x30, 0x00, 0x00, 0x00, 0x00, 0x04},    // Remove Imager (Sensor) Reset  
    delay 100ms

