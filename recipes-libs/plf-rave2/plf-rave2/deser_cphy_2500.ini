{0x1E00,0xF4}   //  (config_soft_rst_n - PHY2): 0x0
{0x1E00,0xF4} 
{0x041B,0x39}   // CSI Phy 2 is 2500 Mbps/lane
{0x0415,0x39} // Line rate
{0x0418,0x39} // Line rate
{0x041B,0x39} // Line rate
{0x041E,0x39} // Line rate
