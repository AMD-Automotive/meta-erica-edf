slave-id DESERIALIZER
{0x0001,0xD0}   // I@C for port 0 and 1
{0x0003,0x55}   // Disables port 0 I2C and Enables Port 1
{0x0007,0xF0}   // Allows Crossover of Port 0 and 1
{0x040B,0x00}   // CSI OUT disable
{0x0006,0xFF}   // Enable all GMSL2s and all links
{0x0003,0xAA}   // Remote channels enabled 
delay 5us
{0x00F0,0x40}   // Pipe X PHY A, Pipe X PHY B
{0x00F1,0xC8}   // Pipe X PHY C, Pipe X PHY D
{0x00F4,0x0F}   // Enables PIPE 0,1,2,3

