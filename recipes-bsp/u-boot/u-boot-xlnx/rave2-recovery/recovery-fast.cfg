# U-Boot Kconfig fragment for the rave2-recovery MACHINE only.
# Goal: minimize time from POR to "bootm" of the recovery FIT.
#
# We deliberately do NOT disable subsystems (NET/USB/MMC/NVMe/FS/EFI/...) here
# because Xilinx distro_bootcmd / BOOT_TARGET_DEVICES has compile-time
# assertions that fire if a device is referenced without its CONFIG_CMD_*.
# Compiled-in but unused subsystems do not cost boot time — distro_bootcmd
# is what scans them, and we replace BOOTCOMMAND below so nothing scans.

# --- Boot timing & UI ---------------------------------------------------------
# Skip autoboot countdown entirely.
CONFIG_BOOTDELAY=0

# Override BOOTCOMMAND: skip distro/bootmenu, jump straight into the recovery
# polling loop defined in include/configs/amd_edf.h.
CONFIG_BOOTCOMMAND="run recovery_cmd"

# No interactive autoboot keys / preboot hook.
# CONFIG_AUTOBOOT_KEYED is not set
# CONFIG_AUTOBOOT_USE_MENUKEY is not set
# CONFIG_USE_PREBOOT is not set
CONFIG_PREBOOT=""

# Silence U-Boot console output (kernel still prints if loglevel allows).
CONFIG_SILENT_CONSOLE=y
CONFIG_SILENT_CONSOLE_UPDATE_ON_SET=y
CONFIG_SYS_DEVICE_NULLDEV=y
