# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-erica-edf"
BBFILE_PATTERN_meta-erica-edf = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-erica-edf = "6"

LAYERDEPENDS_meta-erica-edf = "core"
LAYERSERIES_COMPAT_meta-erica-edf = "scarthgap"

# ---------------------------------------------------------------------------
# (The sentry forever-mode amdxdna override guard that used to sit here was
# removed together with recipes-xrt/. It masked
# recipes-xrt/amdxdna/amdxdna_%.bbappend when no base amdxdna recipe was
# present; with the bbappend itself gone there is nothing left to mask.)
BBMASK += "${@'' if any(os.path.exists(os.path.join(l, 'recipes-multimedia/isp/isp-media-server_2.0.bb')) for l in (d.getVar('BBLAYERS') or '').split()) else 'recipes-multimedia/isp/isp-media-server_2.0.bbappend'}"
BBMASK += "${@'' if any(os.path.exists(os.path.join(l, 'recipes-multimedia/isp/kernel-module-isp_6.18.0.bb')) for l in (d.getVar('BBLAYERS') or '').split()) else 'recipes-multimedia/isp/kernel-module-isp_6.18.0.bbappend'}"
BBMASK += "${@'' if any(os.path.isdir(os.path.join(l, 'recipes-graphics/kmscon')) for l in (d.getVar('BBLAYERS') or '').split()) else 'recipes-extended/kmscon/kmscon_%.bbappend'}"

INHERIT += "image-buildinfo"
IMAGE_BUILDINFO_VARS:append = " DATETIME DISTRO_NAME IMAGE_BASENAME MACHINE TUNE_PKGARCH" 
IMAGE_BUILDINFO_VARS:append = " MACHINE_FEATURES DISTRO_FEATURES COMMON_FEATURES IMAGE_FEATURES"
IMAGE_BUILDINFO_VARS:append = " TUNE_FEATURES TARGET_FPU EDF_TOOL_VERSION"

EDF_TOOL_VERSION = "unknown"
EDF_TOOL_VERSION:amdtool-2025_1 = "2025.1"
EDF_TOOL_VERSION:amdtool-2025_2 = "2025.2"
EDF_TOOL_VERSION:amdtool-2026_1 = "2026.1"
