require conf/distro/poky-altcfg.conf

include conf/distro/include/amd-edf-feed.conf

include conf/distro/include/amd-edf-mirrors.conf

# Because we are no longer strictly poky-altcfg, set distro variables

DISTRO = "erica-edf"
DISTRO_NAME = "ERICA Variant of AMD Embedded Development Framework Linux distribution"

# Define the default hostname
hostname:pn-base-files:amd-edf = "amd-ecp"

# Based on poky-altcfg
DISTROOVERRIDES = "poky:poky-altcfg:amd-edf"

AMD-EDF_VERSION = "25.11"
AMD-EDF_MINOR = ""

# Set to "development" or "release" for release
AMD-EDF_VER_TYPE = "development"

# This will be set in local.conf for CI builds
AMD-EDF_VER_BUILD ?= "${@'${METADATA_REVISION}' if d.getVar('METADATA_REVISION') != '<unknown>' else 'unknown'}"

# Follow the Poky format of <Version>+<type>-<date>
DISTRO_VERSION = "${AMD-EDF_VERSION}${AMD-EDF_MINOR}+${AMD-EDF_VER_TYPE}-${AMD-EDF_VER_BUILD}"

SDK_VENDOR = "-amdedfsdk"

MAINTAINER = "Kris Chaplin <kris.chaplin@amd.com>"

TARGET_VENDOR = "-amd"

# Define the ROS2 Yocto release
ROS_OE_RELEASE_SERIES = "scarthgap"

# Define ROS2 distro release
ROS_DISTRO = "jazzy"

# While microblaze (classic) is not supported, we want to ensure it can
# be built if needed
POKY_INIT_MANAGER:amd-edf:microblaze = "sysvinit"
AMD-EDF_DISTRO_FEATURES:microblaze = ""

# Recovery image doesnt use PL
BOOTBIN_NO_PL:rave2-recovery = "1"


AMD-EDF_DISTRO_FEATURES = " \
    multiarch \
    security \
    virtualization \
    "

AMD-EDF_DISTRO_FEATURES:append:arm = " \
    vmsep \
    "

AMD-EDF_DISTRO_FEATURES:append:aarch64 = " \
    openamp \
    tpm \
    vmsep \
    xen \
    efi \
    polkit \
    rauc \
    opencl \
    "

DISTRO_FEATURES:append = " ${AMD-EDF_DISTRO_FEATURES}"

# Ensure rauc is enabled fully, this will require a temporary override and setting
SYSTEM_CONTROLLER_RAUC_DEMO = "yes"
DISTROOVERRIDES .= "${@ ':system-controller-rauc-demo' if bb.utils.to_boolean(d.getVar('SYSTEM_CONTROLLER_RAUC_DEMO'), False) else ''}"

# Set EFI_PROVIDER to systemd-boot for EDF by default
EFI_PROVIDER ?= "systemd-boot"

PREFERRED_RPROVIDER_virtual-systemd-bootconf = "systemd-bootconf-edf"

# The following really should not refer to MACHINE_FEATURES, but there isn't
# a better way at this point
DISTRO_FEATURES:append = "${@bb.utils.contains('MACHINE_FEATURES', 'mali400', ' libmali', '', d)}"
DISTRO_FEATURES:append = "${@bb.utils.contains('MACHINE_FEATURES', 'malig78ae', ' libmali', '', d)}"
DISTRO_FEATURES[vardepsexclude] += "MACHINE_FEATURES"

# Disable Busybox - Based on Poky example here:
# poky/meta-poky/conf/templates/default/local.conf.sample.extended

PREFERRED_PROVIDER_base-utils = "packagegroup-core-base-utils"
VIRTUAL-RUNTIME_base-utils = "packagegroup-core-base-utils"
VIRTUAL-RUNTIME_base-utils-hwclock = "util-linux-hwclock"
VIRTUAL-RUNTIME_base-utils-syslog = ""

# Enable license package generation
LICENSE_CREATE_PACKAGE = "1"

# Set start-jupyterlab as default start daemon.
PREFERRED_PROVIDER_start-jupyter = "start-jupyterlab"

# AMD EDF builds should use the AMD EDF U-Boot script
UBOOT_BOOT_SCRIPT_SOC_DEFAULT = "u-boot-edf-scr"
UBOOT_BOOT_SCRIPT = "u-boot-edf-scr"
UBOOT_BOOT_SCRIPT:kria = "u-boot-xlnx-scr"

# Partition type GUIDs are defined in the Discoverable Partition Specification
ROOTFS_PART_TYPE:arm = "69DAD710-2CE4-4E3C-B16C-21A1D49ABED3"
ROOTFS_PART_TYPE:aarch64 = "B921B045-1DF0-41C3-AF44-4C6F280D3FAE"
ROOTFS_PART_TYPE:riscv32 = "60D5A7FE-8E7D-435C-B714-3DD8162144E1"
ROOTFS_PART_TYPE:riscv64 = "72EC70A6-CF74-40E6-BD49-4BDA08E8F224"
ROOTFS_PART_TYPE:x86-64 = "4F68BCE3-E8CD-4DB1-96E7-FBCAF984B709"
ESP_PART_TYPE = "C12A7328-F81F-11D2-BA4B-00A0C93EC93B"
# GUID for "Linux generic" partition type (Discoverable Partitions Spec)
STORAGE_PART_TYPE = "0FC63DAF-8483-4772-8E79-3D69D8477DE4"

# Support enable/disabling on a rootfs basis systemd services.
# The class ships in meta-amd-edf rel-v26.06 (classes-recipe/); older
# meta-amd-edf (2025.1/2025.2) has no such class, so scope to 2026.1 to
# avoid a ParseError there.
IMAGE_CLASSES:append:amdtool-2026_1 = " rootfs-config-systemd-services"

# The portable rootfs machine (e.g. amd-cortexa78-mali-common) clears
# SERIAL_CONSOLES, which drops serial-getty@.service from the rootfs. That not
# only removes the serial login getty but also disables serial-autologin-root
# (the postcommand only patches --autologin into serial-getty@.service). Restore
# a serial getty on ttyAMA0 so both serial login and root autologin work, as on
# 2025.2. Scoped to 2026.1 so 2025.2 builds are unaffected; the override beats
# the generic machine's plain SERIAL_CONSOLES = "".
SERIAL_CONSOLES:amdtool-2026_1 = "115200;ttyAMA0"

# If a serial console was not defined, open a console on /dev/console.
# 'console-getty' is only a valid image feature via the class above, so this
# is likewise scoped to 2026.1.
IMAGE_FEATURES:append:amdtool-2026_1 = " ${@'console-getty' if not d.getVar('SERIAL_CONSOLES') else ''}"

# Use iwd instead of the default wpa-supplicant. iwd is a more modern
# wireless daemon; wpa-supplicant is considered legacy.
WIRELESS_DAEMON = "iwd"

# Configure default users/groups
# Default rules (assumed no debug-tweaks image feature):
# * disabled root login (set by system default)
# * Add a user 'amd-edf' with no password
#   - SSH won't allow passwd-less login w/o debug tweaks, so requires console login
#   - Add to the sudoers file
# * Add 'amd-edf' user to the audio group
# * Add 'amd-edf' user to the video group
IMAGE_CLASSES += "extrausers"
EXTRA_USERS_PARAMS ?= "\
    useradd -p '' amd-edf; \
    groupadd -r aie; \
    groupadd -r wayland; \
    usermod -a -G aie,audio,input,video,wayland amd-edf; \
"
USERADDEXTENSION:append = " amd-useradd-sudoers"
EXTRA_USERS_SUDOERS ?= "amd-edf ALL=(ALL) ALL;"

# Disable OpenAMP device tree overlay package
ENABLE_OPENAMP_DTSI = "${@bb.utils.contains('DISTRO_FEATURES', 'openamp', '2', '0', d)}"

# Include xen dtsi to default dtb until adding IOMMU nodes in SDT is implemented.
ENABLE_XEN_DTSI = "1"
ENABLE_XEN_QEMU_DTSI = "1"

PREFERRED_VERSION_protobuf = "3.21.12"
PREFERRED_VERSION_protobuf-native = "3.21.12"

PACKAGECONFIG:pn-opencv = "opencl v4l libv4l png libav jpeg freetype dnn tiff text gstreamer"
